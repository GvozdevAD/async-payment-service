services:
  postgres:
    networks:
      - payments-internal

  rabbitmq:
    networks:
      - payments-internal

  api:
    networks:
      - payments-internal

  publisher:
    networks:
      - payments-internal

  consumer:
    networks:
      - payments-internal

  webhook-dispatcher:
    networks:
      - payments-internal
      - payments-egress

  migrate:
    networks:
      - payments-internal

  nginx:
    image: nginx:1.30.3-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./dockerfiles/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/api/v1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - payments-edge
      - payments-internal

networks:
  payments-edge:
    driver: bridge
  payments-egress:
    driver: bridge
  payments-internal:
    driver: bridge
    internal: true
