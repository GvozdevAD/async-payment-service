services:
  postgres:
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - payments-net

  rabbitmq:
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - payments-net

  api:
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - payments-net

  publisher:
    env_file:
      - .env
    networks:
      - payments-net

  consumer:
    env_file:
      - .env
    networks:
      - payments-net

  webhook-dispatcher:
    env_file:
      - .env
    networks:
      - payments-net

  migrate:
    env_file:
      - .env
    networks:
      - payments-net

networks:
  payments-net:
