name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://payments:payments@localhost:5432/payments
      DATABASE_URL_SYNC: postgresql+psycopg://payments:payments@localhost:5432/payments
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      API_KEY: ci-test-key-0123456789
      RABBITMQ_EXCHANGE: payments
      RABBITMQ_PAYMENTS_NEW_QUEUE: payments.new
      RABBITMQ_PAYMENTS_NEW_DLQ: payments.new.dlq
      RABBITMQ_PAYMENTS_NEW_ROUTING_KEY: payments.new
      OUTBOX_PUBLISHER_ENABLED: "false"
      WEBHOOK_DISPATCHER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev,migration

      - name: Lint
        run: poetry run ruff check .

      - name: Migrate
        run: poetry run alembic upgrade head

      - name: Tests + coverage gate
        run: poetry run pytest --cov=app --cov-report=term-missing --cov-fail-under=100

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f dockerfiles/app/Dockerfile -t async-payment-service:ci .
