[project]
name = "async-payment-service"
version = "0.1.0"
description = "Async payment processing microservice with guaranteed event delivery and webhook notifications"
authors = [
    {name = "dark_loop",email = "alexander@gvozdev.net"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "faststream[rabbit] (>=0.7.1,<0.8.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "aio-pika (>=9,<10)",
    "tenacity (>=9.1.4,<10.0.0)",
    "greenlet (>=3.5.3,<4.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "opentelemetry-sdk (>=1.43.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-grpc (>=1.43.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.64b0,<0.65)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.64b0,<0.65)",
    "opentelemetry-instrumentation-httpx (>=0.64b0,<0.65)",
    "opentelemetry-instrumentation-logging (>=0.64b0,<0.65)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.15.21,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]
migration = [
    "alembic (>=1.18.5,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are intentionally called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Body",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
